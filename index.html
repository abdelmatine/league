    <script>document.documentElement.classList.add('js')</script>
    <!-- Loader (spec §6.1; driven by src/lib/loader.ts). Fixed overlay: it never moves layout. CSS failsafe at 10 s
         (0.6 s on a same-session visit, html.ld-r); hidden without JS. -->
    <style>
      #ld{position:fixed;inset:0;z-index:99;display:grid;place-content:center;justify-items:center;gap:14px;background:radial-gradient(42% 42% at 50% 44%,#082430,#01080f 72%);color:#aba592;font:600 12px/16px "Source Sans 3",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-align:center;animation:ld-x .6s 10s forwards}
      .ld-r #ld{--p:1;animation-delay:.3s;animation-duration:.3s}
      @keyframes ld-x{50%{visibility:hidden}to{opacity:0;visibility:hidden}}
      #ld .r{position:relative;width:min(50vmin,220px);margin-bottom:10px}
      #ld svg{display:block;fill:none;overflow:visible}
      #ld circle{stroke:#87672f}
      #ld .k{stroke:#4a3918;stroke-width:4;stroke-dasharray:.6 5.264}
      #ld .t,#ld .p{stroke-width:4}
      #ld .t{stroke:#08313f}
      #ld .p{stroke:#2fd0c4;stroke-dasharray:296;stroke-dashoffset:calc(296px - 296px*var(--p,0));transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .45s cubic-bezier(.12,.8,.16,1)}
      #ld path{stroke:#d1b47c}
      #ld .c{fill:#2fd0c4;stroke:none}
      #ld i{position:absolute;inset:11%;border:2px solid transparent;border-top-color:#d3faf680;border-radius:50%;animation:ld-s 1.1s linear infinite}
      @keyframes ld-s{to{transform:rotate(1turn)}}
      #ld p{margin:0;opacity:0;translate:0 6px;transition:opacity .3s,translate .3s cubic-bezier(.12,.8,.16,1)}
      #ld .a{font:700 clamp(20px,5.4vw,30px)/1.1 "Literata Caps",Georgia,serif;letter-spacing:.06em;color:#f3ead6}
      #ld.ok p,.ld-r #ld p{opacity:1;translate:none}
      #ld.ok i,.ld-r #ld i{display:none}
      #ld .s{position:absolute;clip-path:inset(50%)}
      @media (prefers-reduced-motion:reduce){#ld i{display:none}#ld .p{transition:none}}
    </style>
    <noscript><style>#ld{display:none}</style></noscript>
  </head>
  <body>
    <div id="ld">
      <div class="r" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <circle class="k" cx="60" cy="60" r="56" />
          <circle cx="60" cy="60" r="52" />
          <circle class="t" cx="60" cy="60" r="47" />
          <circle class="p" cx="60" cy="60" r="47" />
          <circle cx="60" cy="60" r="41" />
          <path d="M60 49l11 11-11 11-11-11z" />
          <path class="c" d="M60 55l5 5-5 5-5-5z" />
        </svg>
        <i></i>
      </div>
      <p class="a" aria-hidden="true">Match accepted</p>
      <p aria-hidden="true">Waiting for other players</p>
      <p class="s" role="status">Loading portfolio</p>
    </div>
    <div id="root"></div>
    <script>!function(d,l){try{sessionStorage.getItem("ld")&&d.classList.add("ld-r")}catch(e){}d.classList.contains("ld-r")||l.style.setProperty("--p",".1")}(document.documentElement,document.getElementById("ld"))</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
