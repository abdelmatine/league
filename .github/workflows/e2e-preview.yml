# Runs the Playwright suite against every successful Vercel preview deployment.
# Needs the repo secret VERCEL_AUTOMATION_BYPASS_SECRET (Vercel → Settings → Deployment Protection).
name: e2e on Vercel preview
on: deployment_status
jobs:
  e2e:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - if: failure()
        uses: actions/upload-artifact@v6
        with: { name: playwright-report, path: test-results, retention-days: 7 }
